name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Full suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}
      - run: npx playwright install --with-deps chromium
      - run: npm run sut:up
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: always()
        run: npm run sut:down
      - name: Upload this shard's raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  report:
    name: Allure report
    needs: [test, perf]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Merge shard results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # Restored before generation and saved after, so the report keeps its
      # trend and flaky history from the first run onwards.
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - run: npm run allure:generate

      - name: Save Allure history
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Download k6 summary
        uses: actions/download-artifact@v4
        with:
          name: k6-summary
          path: k6-summary

      - name: Embed k6 report into Pages site
        run: |
          mkdir -p allure-report/perf
          cp k6-summary/perf-summary.html allure-report/perf/index.html
          cp k6-summary/perf-summary.json allure-report/perf/perf-summary.json

      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true

      - name: Link reports in job summary
        run: |
          echo "### 📊 [Allure report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> "$GITHUB_STEP_SUMMARY"
          echo "### ⚡ [k6 checkout load report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/perf/)" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: k6 checkout load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}
      # A fresh SUT per run also means fresh product stock, which the scenario
      # depends on.
      - run: npm run sut:up
      - uses: grafana/setup-k6-action@v1
      # Thresholds in the script are the gate — a non-zero exit fails the job.
      - run: npm run perf
      - if: always()
        run: npm run sut:down
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: |
            perf-summary.json
            perf-summary.html
          retention-days: 30
