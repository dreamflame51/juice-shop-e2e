name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & typecheck
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}
      - run: npm run lint
      - run: npm run type-check

  smoke:
    name: Smoke suite
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}
      - run: npx playwright install --with-deps chromium
      - name: Start the SUT
        run: npm run sut:up
      - run: npm run test:smoke
      - name: Stop the SUT
        if: always()
        run: npm run sut:down
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Deploy Allure preview to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: pr-preview/${{ github.event.pull_request.number }}
          keep_files: true

      - name: Link report in job summary
        if: always()
        run: echo "### 📊 [Allure report preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/)" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: Remove Allure preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Delete PR preview folder
        run: |
          rm -rf "pr-preview/${{ github.event.pull_request.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove Allure preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi
